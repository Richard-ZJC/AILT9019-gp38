<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Campus Recycling Helper — HKU</title>
<style>
  :root {
    --bg: #f5f6f3;
    --panel: #ffffff;
    --ink: #1c2321;
    --muted: #6b7570;
    --line: #e2e6e1;
    --accent: #2f6d4f;
    --accent-soft: #e8f1ea;
    --warn: #b3261e;
    --warn-soft: #fdecea;
    --amber: #8a5a00; --amber-soft: #fdf1d8;
    --blue: #1d5b8f;  --blue-soft: #e3eef8;
    --teal: #0f6b67;  --teal-soft: #e0f2f0;
    --slate: #46525b; --slate-soft: #eceff2;
    --purple: #5b3b8c; --purple-soft: #efe7fa;
    --orange: #9a4b00; --orange-soft: #fdece0;
    --gray: #5a6360;  --gray-soft: #eceeed;
    /* spacing scale: 8 / 12 / 16 / 24 / 32 / 48 */
    --s1: 8px; --s2: 12px; --s3: 16px; --s4: 24px; --s5: 32px; --s6: 48px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: clamp(15px, 1vw + 11px, 16.5px)/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "PingFang HK", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: clamp(32px, 7vh, 72px) clamp(20px, 4vw, 32px) var(--s6); }
  header h1 { font-size: clamp(24px, 2vw + 16px, 30px); line-height: 1.25; margin: 0 0 var(--s1); letter-spacing: -0.015em; }
  header p { margin: 0; color: var(--muted); max-width: 46ch; }
  .search { display: flex; gap: 10px; margin: var(--s5) 0 var(--s2); }
  .search input {
    flex: 1; min-width: 0; padding: 15px 16px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--panel); font-size: 16px; color: var(--ink); outline: none;
  }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  button { font: inherit; cursor: pointer; }
  .primary {
    padding: 15px 24px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 600;
    white-space: nowrap;
  }
  .primary[disabled] { opacity: 0.55; cursor: progress; }
  .samples { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: var(--s6); }
  .chip {
    padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--panel); color: var(--muted); font-size: 13.5px;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: clamp(24px, 3.5vw, 32px); margin-bottom: var(--s3);
  }
  .product { font-size: 19px; font-weight: 650; letter-spacing: -0.01em; margin: 0 0 var(--s3); }
  .comp { border-top: 1px solid var(--line); padding: var(--s4) 0 var(--s2); }
  .comp:first-of-type { border-top: 0; padding-top: 0; }
  .comp-head { display: flex; align-items: baseline; gap: var(--s2); flex-wrap: wrap; }
  .comp-name { font-weight: 600; font-size: 16px; }
  .comp-name span { color: var(--muted); font-weight: 400; }
  .tag { padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 650; white-space: nowrap; }
  .tag.paper   { background: var(--amber-soft);  color: var(--amber); }
  .tag.tetra   { background: var(--teal-soft);   color: var(--teal); }
  .tag.plastic { background: var(--blue-soft);   color: var(--blue); }
  .tag.metal   { background: var(--slate-soft);  color: var(--slate); }
  .tag.glass   { background: var(--purple-soft); color: var(--purple); }
  .tag.special { background: var(--orange-soft); color: var(--orange); }
  .tag.waste   { background: var(--gray-soft);   color: var(--gray); }
  .tag.refuse  { background: var(--warn-soft);   color: var(--warn); }
  .comp p { margin: var(--s2) 0 0; color: #333b38; max-width: 56ch; }
  .comp .src { font-size: 13px; color: var(--muted); margin-top: var(--s2); }
  .comp .src a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  .comp .src a:hover { border-bottom-color: var(--accent); }
  .degraded { color: var(--amber); font-size: 13px; margin-top: var(--s3); }
  .banner { border-radius: 16px; padding: var(--s4); margin-bottom: var(--s3); border: 1px solid; line-height: 1.6; }
  .banner strong { display: block; margin-bottom: var(--s1); font-size: 16px; }
  .banner.refuse { background: var(--warn-soft); border-color: #f3c9c5; color: #7a1d17; }
  .banner.muted  { background: var(--panel);   border-color: var(--line); color: var(--ink); }
  /* clarify options: one swipeable row instead of a wall of buttons */
  .options {
    display: flex; gap: 10px; margin-top: var(--s3);
    overflow-x: auto; scroll-snap-type: x proximity;
    padding: 2px 2px 10px; -webkit-overflow-scrolling: touch;
    scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  }
  .options::-webkit-scrollbar { height: 4px; }
  .options::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }
  .options::-webkit-scrollbar-track { background: transparent; }
  .options button {
    flex: 0 0 auto; scroll-snap-align: start; min-height: 44px;
    padding: 10px 16px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--ink);
  }
  .options button:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .options button.selected { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .clarify-note {
    margin-top: var(--s3); padding: var(--s3); border-radius: 14px;
    background: var(--accent-soft); display: flex; gap: var(--s3); align-items: flex-start;
    animation: reveal .18s ease-out;
  }
  .clarify-note:empty { display: none; }
  @keyframes reveal { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .note-icon {
    flex: 0 0 auto; width: 60px; height: 60px; border-radius: 12px; background: var(--panel);
    display: grid; place-items: center; color: var(--accent);
  }
  .note-icon svg { width: 34px; height: 34px; }
  .note-body { min-width: 0; }
  .note-body strong { display: block; font-size: 15px; margin-bottom: 2px; }
  .note-body p { margin: 0; font-size: 14px; line-height: 1.55; color: #333b38; }
  .note-confirm {
    margin-top: var(--s2); padding: 0; border: 0; background: none;
    color: var(--accent); font-weight: 650; font-size: 14px;
    border-bottom: 1.5px solid var(--accent); padding-bottom: 1px;
  }
  @media (prefers-reduced-motion: reduce) { .clarify-note { animation: none; } }
  .error { color: var(--warn); font-size: 14px; margin-top: var(--s3); }
  footer { margin-top: var(--s6); color: var(--muted); font-size: 13px; }
  footer a { color: var(--accent); text-decoration: none; }
  .hidden { display: none; }
  .spinner { display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px;
    border: 2px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 560px) {
    .search { flex-wrap: wrap; }
    .search input { flex-basis: 100%; }
    .primary { flex: 1; }
    .card { padding: 20px; }
    .product { margin-bottom: var(--s2); }
    .comp { padding: var(--s3) 0 var(--s1); }
    .comp-head { flex-direction: column; align-items: flex-start; gap: 6px; }
  }
  @media (min-width: 1000px) {
    .wrap { max-width: 600px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Campus Recycling Helper</h1>
    <p>Type a product — each packaging part is matched against HKU's published campus rules, or we say we can't.</p>
  </header>

  <form class="search" id="form">
    <input id="query" type="text" placeholder="e.g. Vitasoy lemon tea" autocomplete="off" maxlength="400" />
    <input id="photo" type="file" accept="image/*" class="hidden" />
    <button class="primary" id="go" type="submit">Sort it</button>
  </form>

  <div class="samples" id="samples">
    <button class="chip" type="button">Vitasoy lemon tea</button>
    <button class="chip" type="button">Nissin cup noodles</button>
    <button class="chip" type="button">Starbucks coffee cup</button>
  </div>

  <div id="result"></div>

  <footer>
    Rules: HKU <em>re</em> Campaign —
    <a href="https://wastereduction.hku.hk/photo-guide" target="_blank" rel="noopener">Recycling 101</a> ·
    <a href="https://www.wastereduction.hku.hk/re-kiosk" target="_blank" rel="noopener">re Kiosk</a>.
    No rule → no guess.
  </footer>
</div>

<script>
const CATEGORY_CLASS = {
  "Recyclable - Paper": "paper",
  "Recyclable - Tetra Pak": "tetra",
  "Recyclable - Plastic": "plastic",
  "Recyclable - Metal": "metal",
  "Recyclable - Glass": "glass",
  "Special Handling": "special",
  "General Waste": "waste",
  "Refuse": "refuse"
};

const resultEl = document.getElementById("result");
const queryEl = document.getElementById("query");
const goEl = document.getElementById("go");
let sessionId = null;

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

function setBusy(busy) {
  goEl.disabled = busy;
  goEl.innerHTML = busy ? '<span class="spinner"></span>Sorting' : "Sort it";
}

function componentCard(item) {
  const cls = CATEGORY_CLASS[item.category] || "waste";
  const name = `${escapeHtml(item.part || "packaging")}` +
    (item.material ? ` <span>· ${escapeHtml(item.material)}</span>` : "");
  const tag = item.status === "MATCHED"
    ? `<span class="tag ${cls}">${escapeHtml(item.category)}</span>`
    : `<span class="tag waste">Not covered</span>`;
  const body = item.status === "MATCHED"
    ? `<p>${escapeHtml(item.explanation || item.instruction || "")}</p>` +
      (item.source
        ? `<div class="src"><a href="${escapeHtml(item.source.url)}" target="_blank" rel="noopener">${escapeHtml(String(item.source.name).split(" (")[0])} ↗</a></div>`
        : "")
    : `<p>${escapeHtml(item.message || "Not covered by the current rule set.")}</p>`;
  return `<div class="comp"><div class="comp-head"><span class="comp-name">${name}</span>${tag}</div>${body}</div>`;
}

function render(payload) {
  if (payload.status === "OK") {
    const product = payload.product || {};
    const name = product.name || queryEl.value;
    const brand = product.brand ? ` <span style="color:var(--muted);font-weight:400">· ${escapeHtml(product.brand)}</span>` : "";
    const degraded = payload.degraded ? `<p class="degraded">Response was repaired by the validator before display.</p>` : "";
    resultEl.innerHTML = `<div class="card">
      <p class="product">${escapeHtml(name)}${brand}</p>
      ${(payload.components || []).map(componentCard).join("")}
      ${degraded}
    </div>`;
    return;
  }

  if (payload.status === "CLARIFY") {
    const clarify = payload.clarify || { options: [], labels: {}, hints: {} };
    const buttons = (clarify.options || []).map(id =>
      `<button type="button" data-choice="${escapeHtml(id)}">${escapeHtml(clarify.labels?.[id] || id)}</button>`).join("");
    resultEl.innerHTML = `<div class="card">
      <p class="product">${escapeHtml(clarify.question || "Which packaging do you see?")}</p>
      <div class="options">${buttons}</div>
      <div class="clarify-note" id="clarify-note"></div>
    </div>`;
    const ICONS = {
      "bottle": '<path d="M10 2h4v3l1.5 2.5c.3.5.5 1.1.5 1.7V20a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V9.2c0-.6.2-1.2.5-1.7L10 5V2Z"/><line x1="8" y1="12" x2="16" y2="12"/>',
      "glass-bottle": '<path d="M10 2h4v4l1.2 2.4c.5 1 .8 2 .8 3.1V20a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-8.5c0-1.1.3-2.2.8-3.1L10 6V2Z"/>',
      "carton": '<path d="M8 9l4-6 4 6"/><path d="M7 9h10"/><rect x="7" y="9" width="10" height="12" rx="1"/><path d="M7 13.5h10"/>',
      "cup-paper": '<rect x="4.5" y="4" width="15" height="2" rx="1"/><path d="M6 6l1.2 12.2A2 2 0 0 0 9.2 20h5.6a2 2 0 0 0 2-1.8L18 6"/><path d="M8.2 10.5h7.6l-.5 4.5H8.7l-.5-4.5Z"/>',
      "cup": '<path d="M6 7h12l-1.5 13a2 2 0 0 1-2 1.8h-5A2 2 0 0 1 7.5 20L6 7Z"/><path d="M12 7l2.5-5"/>',
      "can": '<ellipse cx="12" cy="5" rx="6" ry="2"/><path d="M6 5v14c0 1.1 2.7 2 6 2s6-.9 6-2V5"/><path d="M9.5 8.5h5"/>',
      "other": '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.5 2.5 0 1 1 3.9 2.1c-.9.6-1.4 1.1-1.4 2.1"/><line x1="12" y1="16.8" x2="12" y2="16.9"/>'
    };
    let selected = null;
    const noteEl = document.getElementById("clarify-note");
    const showNote = choice => {
      const icon = `<span class="note-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICONS[choice] || ICONS["other"]}</svg></span>`;
      const label = escapeHtml(clarify.labels?.[choice] || choice);
      const hint = escapeHtml(clarify.hints?.[choice] || "This packaging type is covered by the campus rule set.");
      noteEl.innerHTML = `${icon}<div class="note-body"><strong>${label}</strong><p>${hint}</p>
        <button class="note-confirm" type="button">This is it — answer with this →</button></div>`;
      noteEl.querySelector(".note-confirm").addEventListener("click", () => answer(choice));
    };
    resultEl.querySelectorAll("[data-choice]").forEach(btn =>
      btn.addEventListener("click", () => {
        selected = btn.dataset.choice;
        resultEl.querySelectorAll("[data-choice]").forEach(b => b.classList.toggle("selected", b === btn));
        showNote(selected);
      }));
    return;
  }

  if (payload.status === "REFUSE") {
    resultEl.innerHTML = `<div class="banner refuse">
      <strong>Not covered</strong>${escapeHtml(payload.message)}
    </div>`;
    return;
  }

  if (payload.status === "SERVICE_UNAVAILABLE") {
    resultEl.innerHTML = `<div class="banner muted">
      <strong>Service unavailable</strong>${escapeHtml(payload.message)}
    </div>`;
    return;
  }

  resultEl.innerHTML = `<div class="banner muted"><strong>Something went wrong</strong>${escapeHtml(payload.message || "Unknown error")}</div>`;
}

async function post(url, body) {
  const response = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  const data = await response.json().catch(() => ({ status: "ERROR", message: "server returned invalid JSON" }));
  if (!response.ok) throw new Error(data.message || `HTTP ${response.status}`);
  return data;
}

async function identify(text) {
  setBusy(true);
  resultEl.innerHTML = `<div class="card"><p class="product">Checking the campus rule set…</p></div>`;
  try {
    const data = await post("/identify", { text, session_id: sessionId });
    sessionId = data.session_id || sessionId;
    render(data);
  } catch (error) {
    resultEl.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
  } finally {
    setBusy(false);
  }
}

async function answer(choice) {
  if (!sessionId) return;
  setBusy(true);
  try {
    const data = await post("/answer", { session_id: sessionId, choice });
    render(data);
  } catch (error) {
    resultEl.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
  } finally {
    setBusy(false);
  }
}

document.getElementById("form").addEventListener("submit", event => {
  event.preventDefault();
  const text = queryEl.value.trim();
  if (text) identify(text);
});

document.getElementById("samples").addEventListener("click", event => {
  const chip = event.target.closest(".chip");
  if (!chip) return;
  queryEl.value = chip.textContent.trim();
  identify(queryEl.value);
});
</script>
</body>
</html>
